<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Ollasoftware">
  <!-- Tile background with subtle border -->
  <rect width="64" height="64" rx="14" fill="#0f1114"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" stroke="#1c2026" stroke-width="1"/>

  <!-- Three steam wisps rising from the pot (olla = pot, in Spanish/Portuguese) -->
  <path d="M22 19 C 22 16, 24 15, 24 12 C 24 9, 22 8, 22 6"
        stroke="#a7f06c" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.55"/>
  <path d="M32 19 C 32 15, 34 14, 34 10 C 34 6, 32 5, 32 3"
        stroke="#a7f06c" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M42 19 C 42 16, 44 15, 44 12 C 44 9, 42 8, 42 6"
        stroke="#a7f06c" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.55"/>

  <!-- Pot body -->
  <path d="M12 26
           L 52 26
           L 52 46
           A 8 8 0 0 1 44 54
           L 20 54
           A 8 8 0 0 1 12 46
           Z"
        stroke="#a7f06c" stroke-width="3" fill="none" stroke-linejoin="round"/>

  <!-- Pot rim extending past body for the lid line -->
  <line x1="8" y1="26" x2="56" y2="26" stroke="#a7f06c" stroke-width="3" stroke-linecap="round"/>

  <!-- Small accent dot — "the spark" -->
  <circle cx="32" cy="38" r="1.6" fill="#a7f06c"/>
</svg>

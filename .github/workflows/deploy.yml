name: deploy

# Push to `main` -> build on the NH self-hosted runner (LXC 505, label nh-marketing)
# and publish to the Cloudflare Pages project `ollasoftware-marketing`. Managed by NH Ops.
# wrangler is invoked via npx (NOT cloudflare/wrangler-action, which mis-selects bun on this runner).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, nh-marketing]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          npm ci || npm install
          npm run build

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        run: npx --yes wrangler@4 pages deploy dist --project-name ollasoftware-marketing --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Purge Cloudflare Edge Cache
        if: github.ref == 'refs/heads/main'
        run: |
          echo "=== Verifying Token ==="
          curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json"
          echo ""

          echo "=== Listing All Zones ==="
          ALL_ZONES=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json")
          echo "All zones: $ALL_ZONES"

          ZONE_ID=$(echo "$ALL_ZONES" | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf-8"));
            const z = (d.result || []).find(x => x.name.includes("ollasoftware.com")) || (d.result || [])[0];
            console.log(z?.id || "");
          ')

          if [ -n "$ZONE_ID" ]; then
            echo "Purging Cloudflare cache for zone $ZONE_ID..."
            PURGE_RES=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')
            echo "Cloudflare edge cache purge response: $PURGE_RES"
          else
            echo "No zone found in token scope."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
